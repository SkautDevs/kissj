    sfmTopic:
        choose: "Vyber téma"
        education: "O skautské výchově"
        delegates: "Způsob stanovení delegátů a delegátek"
        rovering: "Rovering a vedení"
        youth: "Zapojení mladých do rozhodování"
        environment: "Environmentální výzvy"
        group1-helptext: "Pokud se přihlásíš do 30. listopadu, můžeš ovlivnit, jakými tématy se bude Skautské fórum zabývat. Z prvních dvou témat vyber jedno, další tři seřaď podle svých preferencí.<br><br>Témata, ze kterých vybíráš jedno, se na Valném sněmu téměř jistě objeví, u témat, která řadíš, záleží na usneseních, které se na Valném sněmu shromáždí. I tak nebude naše práce zbytečná, relevantní výstupy poputují k pracovním skupinám Náčelnictva a k odborům Výkonné rady, pokud by se nedostala na Valný sněm.<br><br>Jak budeme s tématem pracovat? Vždy proběhne nějaké nachystání (teoretický úvod), dále pak diskuze, budeme společně hledat řešení dilemat a odpovědi na otázky.<br><br><strong>O skautské výchově</strong><br>V listopadu proběhne schválení dalšího strategického tématu – Kvalitní výchova pro budoucnost. Současně se koná i předsněmová diskuze zabývající se výchovou. Kdo má odpovědnost za naplňování skautské výchovy? Jak v oddíle něco změnit? A co dělat, když chceme zavést třeba družinový systém, proměnit zaběhnuté fungování nebo upustit od používání trestů, ale nedaří se nám to? Společně se podíváme na to, jaké jsou překážky v zavádění změn. Také budeme řešit řízení změny v oddíle a hledat cesty jak docílit toho, aby byla naše snaha úspěšná.<br><br><strong>Způsob stanovení delegátů a delegátek</strong><br>V rámci předsněmové diskuze se řeší varianty, jakými vybíráme naše zástupce na Valný sněm (delegáty a delegátky Valného sněmu). Jedním z motivů je, aby se Valného sněmu mohla zúčastnit i menší střediska. Existuje 5 nových variant, jak by mohlo ke stanovení delegátstva dojít. Všechny bychom společně prodiskutovali a za mladé bychom vytvořili doporučení, jaký způsob výběru delegátstva je preferován."
        group2-helptext: "Seřaď tato témata podle svých preferencí, zbývající téma bereme jako třetí.<br><br><strong>Rovering a vedení</strong><br>71 % roverů a rangers pomáhá s vedením oddílu a vedle toho se zároveň věnuje roveringu, říká roverský průzkum. Máš jako mladý nebo mladá čas a prostor na rovering? Existují nějaké překážky v tom, aby ses roveringu mohl nebo mohla věnovat více naplno? Jak podpořit regionální rovering? Jak podpořit změnu kultury v organizaci a umožnit mezigenerační dialog o roli roverů a rangers? Společně se pokusíme rozklíčovat překážky, které mladým brání věnovat se roveringu, představíme si současné nástroje a budeme hledat řešení, jak rovering umožnit žít naplno.<br><br><strong>Zapojení mladých do rozhodování</strong><br>Jak probíhá rozhodování ve tvém středisku/přístavu nebo jiné jednotce? Čí hlas je více slyšet? Jak ve tvém oddíle/kmeni/středisku probíhá mezigenerační spolupráce? Jak probíhá přebírání odpovědnosti? Společně budeme hledat bariéry zapojení mladých a zkusíme navrhnout funkční řešení.<br><br><strong>Environmentální výzvy</strong><br>Co je pro mě environmentální výzva, se kterou se potýkám? Co pro mě může Junák udělat a jak se může více zapojit? Jakou podporu bych potřeboval nebo potřebovala? Environmentální výzvy jsou také jedním ze strategických témat, které se týká nás všech. V tomto tématu se zaměříme na sdílení, co pro nás environmentální výzvy znamenají, budeme hledat možné cesty podpory a otevření mezigeneračního dialogu, aby téma v organizaci bylo vnímané jako sdílené mezi různými skupinami."
