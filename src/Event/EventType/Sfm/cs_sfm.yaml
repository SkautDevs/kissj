    sfmEvents-helptext: "Například: Celostátní kolo Svojsíkova závodu, Celostátní kolo Závodu vlčat a světlušek, Mosty přes Jarugu, Napříč Prahou – Přes 3 jezy, Setkání výchovných zpravodajů, Ústřice, Poradní skála, Elixír, Ústřední lesní škola, Mikulášský víkend, Roverská porada, SkaRe, Intercamp, Středoevropské jamboree, Hra družin, Korbo, Obrok, Navigamus, Roverway, Helpdesk.<br><br>Pokud ses některé akce zúčastnil nebo zúčastnila víckrát, nebo jsi tam měl nebo měla jinou roli než účastnickou, napiš to prosím také."
    foodOther: "jiné - prosím upřesni v poslední otázce"
