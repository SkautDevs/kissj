login-help:
    text: "<h2>The kissj login system</h2><h3>How does it actually work?</h3><p>At Obrok, you log in to the kissj registration system with your skautIS account.</p><p>After you log in with your skautIS account, kissj takes you to a page where you can fill in your registration.</p><p>You stay logged in until you log out manually.</p><p>After you log out, nobody can access your information, not even from the same device.</p><h3>How do I connect with my troop?</h3><p>When you log in, you get a personal code. Send it to your troop leader, fill in all the required information and then lock your registration.</p><p>Your troop leader adds you to their troop when they log in. Once everyone is added to the troop, the troop leader locks their registration too.</p><h3>Still not sure what to do?</h3><p>Have a look at the <a href='https://obrok.skaut.cz'>Obrok website</a>, where we have prepared a detailed <a href='https://obrok.skaut.cz/registrace'>registration guide</a> for you.</p><h3>Questions?</h3><p>If you run into a problem with logging in, write an email to the event organisers, they will surely do their best to help you.</p>"
    backToLogin: "Back to login"

