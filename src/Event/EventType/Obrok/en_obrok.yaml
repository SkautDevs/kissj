        enjoy: "<strong>What happens next?</strong><br/>We will send you more information by email, including the choice of the job you will do at Obrok. It will not be right away, so do not worry if you do not hear from us for a while. In the meantime, please keep an eye on your inbox (and your spam folder, just in case) so you do not miss anything.<br/><br/>If you have any questions, write to us at <a href=\"mailto:servis@obrok.skaut.cz\">servis@obrok.skaut.cz</a>.<br/><br/>Until then, enjoy the wait for the event, and above all get your tent, backpack and good mood ready!"
